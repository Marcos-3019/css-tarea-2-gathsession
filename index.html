<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="GathSession: build your best community.">
  <title>GathSession — Build your best community</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <main class="page">
    <header class="site-header">
      <a class="brand" href="#inicio" aria-label="GathSession, inicio"><span>Gath</span><span>Session.</span></a>
      <nav class="main-nav" aria-label="Navegación principal">
        <a href="#inicio">Home</a>
        <a href="#features">Features</a>
        <a href="#events">Events</a>
        <a href="#community">Community</a>
        <a href="#about">About Us</a>
      </nav>
    </header>

    <section class="hero" id="inicio" aria-labelledby="hero-title">
      <div class="hero-copy">
        <h1 id="hero-title">Build your best<br>community<br>starting from here.</h1>
        <p class="hero-description">Find a community that fits the best people to<br>connect, create or celebrate in a more effective way.</p>
        <div class="hero-actions">
          <a class="button button-primary" href="#community">Get Started <span aria-hidden="true">↗</span></a>
          <a class="button button-text" href="#about">Learn More <span aria-hidden="true">→</span></a>
        </div>
        <div class="feature-row" id="features">
          <div class="feature"><span class="feature-icon" aria-hidden="true">✿</span><span>Great<br>Community</span></div>
          <div class="feature"><span class="feature-icon" aria-hidden="true">▦</span><span>Easy<br>Events</span></div>
          <div class="feature"><span class="feature-icon" aria-hidden="true">◎</span><span>Global<br>Connection</span></div>
        </div>
      </div>

      <div class="people" aria-label="Personas de la comunidad">
        <div class="person person-orange"><img src="assets/images/persona-naranja.png" alt="Miembro de la comunidad con camiseta naranja"></div>
        <div class="person person-pink"><img src="assets/images/persona-rosa.png" alt="Miembro de la comunidad con jersey rosa"></div>
        <div class="person person-yellow"><img src="assets/images/persona-amarilla.png" alt="Miembro de la comunidad con ropa amarilla"></div>
        <div class="person person-brown"><img src="assets/images/persona-chaqueta.png" alt="Miembro de la comunidad con chaqueta marrón"></div>
        <div class="person person-floral"><img src="assets/images/persona-gafas.png" alt="Miembro de la comunidad con gafas de sol"></div>
        <span class="orbit orbit-one" aria-hidden="true"></span>
        <span class="orbit orbit-two" aria-hidden="true"></span>
      </div>
    </section>
  </main>
</body>
</html>
